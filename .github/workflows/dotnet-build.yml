name: Build Project

on:
  workflow_dispatch:
  push:
    branches: [ main, new/for2.2 ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install ClassIsland.PluginSdk.Cli
        run: dotnet tool install --global ClassIsland.PluginSdk.Cli

      - name: Verify 2.2 migration (dry-run)
        shell: powershell
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          cipx migrate --dry-run; if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 2) { exit 0 } else { exit $LASTEXITCODE }

      - name: Restore dependencies
        run: dotnet restore

      - name: Build CIPX
        run: dotnet publish -p:CreateCipx=true --configuration Release --no-restore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classisland-ratelimit-cipx-artifacts
          path: |
            D:\a\RateLimit\RateLimit\cipx\ClassIsland.RateLimit.cipx